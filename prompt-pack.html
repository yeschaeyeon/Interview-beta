<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>프롬프트 묶음 만들기 (제작자용)</title>
<style>body{font:15px/1.6 sans-serif;max-width:720px;margin:24px auto;padding:0 16px}textarea,input{width:100%;box-sizing:border-box;border:1.5px solid #111;padding:10px;font:inherit}button{border:1.5px solid #111;background:#111;color:#fff;padding:10px 16px;font:inherit;font-weight:700;margin-top:12px}small{color:#666}</style></head>
<body>
<h2>프롬프트 묶음 만들기 (제작자용)</h2>
<p>여기에 적은 프롬프트를 암호화해서 <b>qprompt.js</b> 파일로 만들어 줘요. 사이트에 올릴 때 <code>qprompt.js</code> 를 이 파일로 바꾸면 돼요. 사용자 화면에는 프롬프트가 보이지 않고 "복사" 버튼만 있어요.</p>
<p>활동 목록(예상질문 변환)과 생기부 전체 글(참고자료 추출)은 앱이 프롬프트 뒤에 자동으로 붙여요. 프롬프트에는 그 내용을 쓰지 마세요.</p>
<label>① 예상질문 변환 (내 예상질문 파일을 생기부 활동에 맞게 분류)</label><textarea id="p0" rows="14"></textarea>
<label>② 참고자료 추출 (생기부 전체에서 책·논문·기사·개념 추출)</label><textarea id="p1" rows="14"></textarea>
<label>이용 코드 (선택)</label>
<input id="c" placeholder="비워 두면 코드 없이 복사 가능 (소스를 뜯어보면 풀 수 있어요)">
<small>코드를 정하면, 코드를 아는 사람만 프롬프트를 복사할 수 있어요. 코드는 사이트에 저장되지 않으니 사용자에게 따로 알려 주세요.</small><br>
<button id="go">qprompt.js 만들기</button>
<p id="msg"></p>
<script type="module" src="prompt-pack.page.js"></script>
</body></html>
